name: Release

on:
  push:
    branches: [main]

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      # Токен пользователя, а не GITHUB_TOKEN: иначе CI не запустится на release PR.
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run verify:packages
      # Node нужен только для npm publish с OIDC; весь тулинг выше работает в рантайме Bun.
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      # Trusted Publishing требует npm CLI 11.5.1+, а в Node 22.14 лежит npm 10.
      - run: npm install -g npm@^11.5.1
      - name: Проверить версии Node и npm
        run: |
          at_least() { [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | head -n1)" = "$2" ]; }
          node_version="$(node --version | sed 's/^v//')"
          npm_version="$(npm --version)"
          echo "node $node_version, npm $npm_version"
          at_least "$node_version" 22.14.0 || { echo "Нужен Node 22.14.0 или новее"; exit 1; }
          at_least "$npm_version" 11.5.1 || { echo "Нужен npm 11.5.1 или новее"; exit 1; }
      - name: Опубликовать изменённые пакеты
        env:
          PATHS_RELEASED: ${{ needs.release-please.outputs.paths_released }}
        run: bun scripts/publish-released.ts "$PATHS_RELEASED"
