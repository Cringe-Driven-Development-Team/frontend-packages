name: Release

on:
  push:
    branches: [main]
  # Повторная карточка выпуска по отчёту прошлого запуска: только notify, без публикации.
  workflow_dispatch:
    inputs:
      run_id:
        description: ID запуска Release, карточку которого отправить повторно
        required: true
        type: string

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      # Токен пользователя, а не GITHUB_TOKEN: иначе CI не запустится на release PR.
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # Результаты шагов нужны job notify, чтобы назвать этап сбоя.
    outputs:
      install: ${{ steps.install.outcome }}
      build: ${{ steps.build.outcome }}
      verify: ${{ steps.verify.outcome }}
      integration: ${{ steps.integration.outcome }}
      node: ${{ steps.node.outcome != 'success' && steps.node.outcome || steps.npm.outcome }}
      publish: ${{ steps.publish.outcome }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - id: install
        run: bun install --frozen-lockfile
      - id: build
        run: bun run build
      - id: verify
        run: bun run verify:packages
      # Блок «Совместимость» в карточке опирается на эту проверку релизного коммита.
      - id: integration
        run: bun run test:integration
      # Node нужен только для npm publish с OIDC; весь тулинг выше работает в рантайме Bun.
      - id: node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      # Trusted Publishing требует npm CLI 11.5.1+, а в Node 22.14 лежит npm 10.
      - id: npm
        name: Установить npm и проверить версии Node и npm
        run: |
          npm install -g npm@^11.5.1
          at_least() { [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | head -n1)" = "$2" ]; }
          node_version="$(node --version | sed 's/^v//')"
          npm_version="$(npm --version)"
          echo "node $node_version, npm $npm_version"
          at_least "$node_version" 22.14.0 || { echo "Нужен Node 22.14.0 или новее"; exit 1; }
          at_least "$npm_version" 11.5.1 || { echo "Нужен npm 11.5.1 или новее"; exit 1; }
      - id: publish
        name: Опубликовать изменённые пакеты
        env:
          PATHS_RELEASED: ${{ needs.release-please.outputs.paths_released }}
        run: bun scripts/publish-released.ts "$PATHS_RELEASED" --report release-report.json
      # Своё имя у каждой попытки: перезапуск не должен затирать отчёт попытки, которая опубликовала.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-report-${{ github.run_attempt }}
          path: release-report.json
          if-no-files-found: ignore

  # Отдельный job: Telegram-секреты не попадают в job с id-token: write.
  notify:
    needs: [release-please, publish]
    if: >-
      always() && (github.event_name == 'workflow_dispatch' ||
      needs.release-please.outputs.releases_created == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # Отчёты всех попыток: каждый ложится в каталог reports/release-report-<попытка>.
      - if: github.event_name == 'push'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: release-report-*
          path: reports
      # Отчёт есть, только если шаг публикации запускался: все этапы до него прошли успешно.
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          pattern: release-report-*
          path: reports
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - id: replay
        if: github.event_name == 'workflow_dispatch'
        name: Взять пути, коммит и файлы выпуска прошлого запуска
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        # Скрипты остаются из текущей ветки: в коммитах до ручного повтора его поддержки нет.
        # Версии и changelog берутся из коммита того запуска, иначе карточка покажет следующий выпуск.
        # Манифесты React и Zustand — всегда оба: блок совместимости читает версии пары целиком.
        # Без отчётов glob не раскроется, jq упадёт, и повтор остановится.
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .head_sha)
          reports=(reports/release-report-*/release-report.json)
          files=$(jq -rs '[.[][].path | "\(.)/package.json", "\(.)/CHANGELOG.md"]
            + ["packages/react/package.json", "packages/zustand/package.json"] | unique[]' "${reports[@]}")
          echo "Файлы выпуска из $sha:" release-please-config.json $files
          git checkout "$sha" -- release-please-config.json $files
          echo "paths=$(jq -cs '[.[][].path] | unique' "${reports[@]}")" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Отправить итоговую карточку в Telegram
        env:
          PATHS_RELEASED: ${{ steps.replay.outputs.paths || needs.release-please.outputs.paths_released }}
          OUTCOME_INSTALL: ${{ inputs.run_id && 'success' || needs.publish.outputs.install }}
          OUTCOME_BUILD: ${{ inputs.run_id && 'success' || needs.publish.outputs.build }}
          OUTCOME_VERIFY: ${{ inputs.run_id && 'success' || needs.publish.outputs.verify }}
          OUTCOME_INTEGRATION: ${{ inputs.run_id && 'success' || needs.publish.outputs.integration }}
          OUTCOME_NODE: ${{ inputs.run_id && 'success' || needs.publish.outputs.node }}
          OUTCOME_PUBLISH: ${{ inputs.run_id && 'success' || needs.publish.outputs.publish }}
          RELEASE_RUN_ID: ${{ inputs.run_id }}
          RELEASE_SHA: ${{ steps.replay.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_RELEASES_TOPIC_ID: ${{ secrets.TELEGRAM_RELEASES_TOPIC_ID }}
        run: bun scripts/release-notify.ts
